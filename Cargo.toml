[workspace]
members = ["crates/*"]
exclude = ["xtask"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
rust-version = "1.87"
version = "23.1.0-1"

[workspace.dependencies]
anyhow = "1.0.99"
bytes = { version = "1.10" }
cc = "1.2"
constcat = "0.6.1"
dirs = { version = "6.0" }
liblzma = { version = "0.4.4", features = ["static", "parallel"] }
ureq = { version = "3", features = ["rustls"], default-features = false }
serde = { version = "1.0.225", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tar = { version = "0.4" }
walkdir = "2.5.0"
