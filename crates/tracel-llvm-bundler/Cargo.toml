[package]
authors                = ["Tracel Technologies Inc."]
categories             = ["development-tools::ffi"]
description            = "Creates a bundle of a portable version of LLVM Rust bindings."
edition.workspace      = true
keywords               = ["cubecl", "llvm", "mlir", "bindings"]
license.workspace      = true
name                   = "tracel-llvm-bundler"
readme.workspace       = true
repository             = "https://github.com/tracel-ai/tracel-llvm/tree/main/crates/tracel-llvm-bundler"
rust-version.workspace = true
version.workspace      = true

[features]

[dependencies]
dirs = { version = "6.0" }
regex = "1.11.2"
reqwest = { version = "0.12.23", features = ["blocking", "rustls-tls", "http2"], default-features = false }

[build-dependencies]
anyhow = "1.0.99"
bytes = { version = "1.10" }
dirs = { version = "6.0" }
liblzma = { version = "0.4.4", features = ["static", "parallel"] }
reqwest = { version = "0.12.23", features = ["blocking", "rustls-tls", "http2"], default-features = false }
serde = { version = "1.0.225", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tar = { version = "0.4" }
walkdir = "2.5.0"