[package]
authors = [
    "Tracel Technologies Inc.",
    "McCoy R. Becker",
    "Yota Toyama",
    "Edgar Luque",
]
categories = ["external-ffi-bindings"]
description = "Rust bindings for MLIR C API used by CubeCL."
edition.workspace = true
keywords = ["cubecl", "llvm", "mlir", "bindings"]
license = "MIT"
name = "tracel-mlir-sys"
readme.workspace = true
repository = "https://github.com/tracel-ai/tracel-llvm/tree/main/crates/tracel-mlir-sys"
rust-version.workspace = true
version.workspace = true

[features]
# allow xtask to bypass compilation error from bindings/mod.rs
xtask = ["tracel-llvm-bundler/xtask"]

[build-dependencies]
reqwest = { version = "0.12.23", features = ["blocking", "rustls-tls", "http2"], default-features = false }
tracel-llvm-bundler = { path = "../tracel-llvm-bundler", version = "22.1.4-3" }
