name: Release

on:
  workflow_dispatch:

# The LLVM version and release numbers are set in the file `crates/tracel-llvm-bundler/src/config.rs`:
# pub const TRACEL_LLVM_VERSION: &str = "20.1.4";
# pub const TRACEL_LLVM_RELEASE_NUMBER: &str = "6";

jobs:
  create-release:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.compute_tag.outputs.tag }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v5
      # ----------------------------------------------------------------------
      - name: Compute tag
        id: compute_tag
        run: echo "tag=v${{ inputs.llvm_version }}-${{ inputs.release_number }}" >> "$GITHUB_OUTPUT"
      # ----------------------------------------------------------------------
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ steps.compute_tag.outputs.tag }}
          tag_name: ${{ steps.compute_tag.outputs.tag }}
          draft: true
          prerelease: false
          generate_release_notes: false
          make_latest: false

  llvm-linux:
    needs: create-release
    runs-on: [
      '@id:llvm-linux-job-${{ github.run_id }}-${{ github.run_attempt }}',
      # Older Ubuntu to build with a more ancient libc to support more platforms
      '@image-family:ubuntu-2204-lts',
      '@image-project:ubuntu-os-cloud',
      '@disk-size:100',
      '@keep-alive:false',
      '@machine-type:n2-standard-48',
      '@os:linux',
      '@zones:northamerica-northeast1-b'
      ]
    steps:
      - name: Setup Rust
        uses: tracel-ai/github-actions/setup-rust@v6
        with:
          rust-toolchain: stable
          cache-key: stable-linux
      # ----------------------------------------------------------------------
      - name: Build LLVM bunlde
        run: cargo xtask bundle build
      # ----------------------------------------------------------------------
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ needs.create-release.outputs.tag }}
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: |
            .llvm/linux-x64.tar.xz
            .llvm/linux-x64.checksums.json

  # Does not work for now on provided MacOS runners by GitHub
  # llvm-macos:
  #   needs: create-release
  #   runs-on: macos-latest
  #   steps:
  #     - uses: actions/checkout@v5
  #     # ----------------------------------------------------------------------
  #     - name: Build LLVM
  #       run: bash build_llvm.sh ${{ inputs.llvm_version }} ${{ inputs.release_number }}
  #     # ----------------------------------------------------------------------
  #     - name: Upload Release
  #       uses: softprops/action-gh-release@v2
  #       env:
  #         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  #       with:
  #         name: ${{ needs.create-release.outputs.tag }}
  #         tag_name: ${{ needs.create-release.outputs.tag }}
  #         files: |
  #           .llvm/macos-AArch64.tar.xz
  #           .llvm/macos-AArch64.checksums.json

  llvm-windows:
    needs: create-release
    runs-on: [
      '@id:llvm-windows-job-${{ github.run_id }}-${{ github.run_attempt }}',
      '@image-family:windows-2022',
      '@image-project:windows-cloud',
      '@disk-size:100',
      '@keep-alive:false',
      '@machine-type:n2-standard-48',
      '@os:windows',
      '@zones:northamerica-northeast1-b'
      ]
    steps:
      - name: Setup Rust
        uses: tracel-ai/github-actions/setup-rust@v6
        with:
          rust-toolchain: stable
          cache-key: stable-windows
      # ----------------------------------------------------------------------
      - name: Build LLVM bunlde
        run: cargo xtask bundle build
      # ----------------------------------------------------------------------
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ needs.create-release.outputs.tag }}
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: |
            .llvm/windows-x64.tar.xz
            .llvm/windows-x64.checksums.json

  publish-release:
    # needs: [create-release, llvm-linux, llvm-macos, llvm-windows]
    needs: [create-release, llvm-linux, llvm-windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      # ----------------------------------------------------------------------
      - name: Make Release the latest one
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ needs.create-release.outputs.tag }}
          tag_name: ${{ needs.create-release.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: false
          append_body: false
