name: Build and Release LLVM

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g., v20.1.4)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-22.04 # Building on a older Ubuntu to build with a more ancient libc to support more platforms
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.release_tag }}
          release_name: LLVM Release ${{ inputs.release_tag }}
          draft: false
          prerelease: false

  build-and-upload:
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # os: [ubuntu-22.04, macos-latest, windows-latest]
        os: [windows-latest]
        include:
          # - os: ubuntu-22.04
          #   platform: linux-x64
          # - os: macos-latest
          #   platform: macos-x64
          - os: windows-latest
            platform: windows-x64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # - name: Install dependencies (Linux)
      #   if: runner.os == 'Linux'
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y cmake ninja-build xz-utils git

      # - name: Install dependencies (macOS)
      #   if: runner.os == 'macOS'
      #   run: |
      #     brew install cmake ninja xz

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install cmake ninja 7zip --yes

      - name: Build and package LLVM
        run: bash build_llvm.sh

      - name: Upload Release Artifact
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: .llvm/${{ matrix.platform }}.tar.xz
          asset_name: llvm-${{ matrix.platform }}.tar.xz
          asset_content_type: application/x-xz
