name: Read LLVM release config
description: Read LLVM version, release number, and release tag from tracel-llvm-bundler config.rs

outputs:
  llvm_version:
    description: LLVM version from config.rs
    value: ${{ steps.read_config.outputs.llvm_version }}
  release_number:
    description: Tracel LLVM release number from config.rs
    value: ${{ steps.read_config.outputs.release_number }}
  tag:
    description: GitHub release tag
    value: ${{ steps.read_config.outputs.tag }}

runs:
  using: composite
  steps:
    - name: Read LLVM version from config.rs
      id: read_config
      shell: bash
      run: |
        CONFIG_FILE="crates/tracel-llvm-bundler/src/config.rs"

        llvm_version=$(sed -n 's/.*TRACEL_LLVM_VERSION: &str = "\(.*\)";/\1/p' "$CONFIG_FILE")
        release_number=$(sed -n 's/.*TRACEL_LLVM_RELEASE_NUMBER: &str = "\(.*\)";/\1/p' "$CONFIG_FILE")

        if [[ -z "$llvm_version" || -z "$release_number" ]]; then
          echo "Failed to extract LLVM version or release number from config.rs"
          exit 1
        fi

        tag="v${llvm_version}-${release_number}"

        echo "llvm_version=$llvm_version" >> "$GITHUB_OUTPUT"
        echo "release_number=$release_number" >> "$GITHUB_OUTPUT"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
